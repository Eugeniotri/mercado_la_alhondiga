<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado La Alhóndiga - Contacto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="cabecera">
        <div class="logo">
            <p>Mercado La Alhóndiga</p>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="01_index.html">Inicio</a></li>
                <li><a href="02_puestos.html">Puestos</a></li>
                <li><a href="03_contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenido">

        <section class="cabecera-pagina">
            <h1>Contacto</h1>
            <p>Rellena el formulario para enviarnos tu consulta sobre el mercado.</p>
        </section>

        <section class="formulario-contacto">
            <form action="#" method="post">

                <div class="campo-formulario">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" name="nombre" type="text" required>
                </div>

                <div class="campo-formulario">
                    <label for="correo">Mail</label>
                    <input id="correo" name="correo" type="email" required>
                </div>

                <div class="campo-formulario">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                </div>

                <div class="campo-formulario">
                    <input id="condiciones" name="condiciones" type="checkbox" required>
                    <label for="condiciones">Acepto las condiciones</label>
                </div>

                <button type="submit">Enviar</button>

            </form>
        </section>

    </main>

    <footer class="pie-pagina">
        <p>© 2025 Mercado de Barrio La Alhóndiga</p>
        <p><a href="#">Aviso legal</a> | <a href="#">Política de privacidad</a></p>
    </footer>

</body>
</html>
